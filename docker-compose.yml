version: '3.8'

services:
  frontend:
    build:
      context: ./frontend/my-app
      dockerfile: Dockerfile
      # This variable determines which stage of the Dockerfile to build
      target: ${DOCKER_TARGET:-dev}
    ports:
      # Port mapping changes based on the target
      - "5173:5173"
      - "4173:4173"
    env_file:
      - ./frontend/my-app/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
